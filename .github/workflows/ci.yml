---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "15 3 * * 0"

jobs:
  lint:
    name: Lint and security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting.
        run: test -z "$(gofmt -l .)"

      - name: Vet.
        run: go vet ./...

      - name: Staticcheck.
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Security scan.
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest ./...

      - name: Check for known vulnerabilities.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64, arm, 386, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static binary.
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: '7'
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o chronytop-linux-${{ matrix.arch }} .

      - uses: actions/upload-artifact@v4
        with:
          name: chronytop-linux-${{ matrix.arch }}
          path: chronytop-linux-${{ matrix.arch }}
